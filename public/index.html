<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#264637"><meta name="apple-mobile-web-app-capable" content="yes"><title>三国杀</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/table.css"></head>
<body><header class="header"><h1>三国杀</h1><span id="connection" role="status">未加入房间</span><nav><button id="joinRoom">加入房间</button><button id="createRoom" class="primary">创建房间</button><button id="leaveRoom" class="danger" hidden>退出房间</button><button id="reference">图鉴 / 规则</button><button id="help">联机</button><button id="screenMode" aria-pressed="false" title="全屏游玩">全屏</button><button id="showLog" class="landscape-log">记录</button></nav></header>
<aside id="orientationHint" class="orientation-hint"><span class="rotate-symbol" aria-hidden="true">↻</span><div><strong>建议横屏游玩</strong><span>横过手机，牌桌和手牌会并排展开。</span></div><button id="landscapeFullscreen" class="primary">横屏全屏</button><button id="dismissOrientation" class="hint-dismiss" aria-label="关闭横屏提示">×</button></aside><main><section id="welcome" class="welcome"><h2>选择武将，进入房间</h2><p>创建一局，或输入朋友的口令码加入。</p><div><button id="welcomeCreate" class="primary">创建房间</button><button id="welcomeJoin">加入房间</button></div><section id="recovery" class="recovery" hidden><h3>返回牌桌</h3><div id="recoverSeats"></div></section></section><div id="gameView" hidden><section class="room-toolbar"><div><strong id="roomLabel"></strong><span id="seatCount"></span><button id="copy" title="复制口令码">复制口令码</button></div><div class="setup-controls"><div class="choice-group"><span>模式</span><fieldset id="mode" class="choices" aria-label="游戏模式"></fieldset></div><button id="changeGeneral">更换武将</button><button id="generalDetail">技能说明</button></div></section>
<div class="layout"><div class="table-column"><section class="board" aria-label="牌桌"><div class="board-heading"><strong id="turnNote">创建或加入房间后开始</strong><span id="round">未开局</span><span>牌堆 <b id="deck">0</b></span></div><div class="players" id="opponents"></div><div class="played" id="played"></div></section>
<section class="self-panel"><div class="self-header"><div><strong id="selfName"></strong><span id="role"></span><span id="health" class="health"></span><small id="selfCaption">你</small></div><div class="self-controls"><button id="selfTarget" hidden>选择自己</button><button id="ownDetail">查看武将</button></div></div><div id="equipment" class="equipment"></div><div class="skills-summary" id="skillsSummary"></div></section>
<div id="statusBanner" class="status-banner" role="status"></div>
<section id="responsePanel" class="response-panel" hidden><h2 id="responseText"></h2><div id="optionLabel" class="choice-group"><span>响应选项</span><fieldset id="responseOption" class="choices" aria-label="响应选项"></fieldset></div><div id="specialCards"></div><p id="responseHint"></p><div class="response-actions"><button id="respond" class="primary">确认响应</button><button id="pass">放弃响应</button></div></section>
<section class="hand-panel"><div class="hand-heading"><strong>手牌 <span id="handCount">0</span></strong><span>点选卡牌，说明显示在下方</span><button id="clearSelection">取消选择</button></div><div id="hand" class="hand"></div><div id="cardDescription" class="card-description">选择卡牌查看说明。</div></section>
<section class="action-bar"><div class="action-selects" id="actionSelects"><div class="choice-group" id="conversionLabel"><span>使用方式</span><fieldset id="asCard" class="choices" aria-label="使用方式"></fieldset></div><div class="choice-group" id="skillLabel"><span>武将技能</span><fieldset id="skillSelect" class="choices" aria-label="武将技能"></fieldset></div><span id="selectionHint">未选牌</span></div><div class="action-buttons"><button id="start" class="primary">创建房间</button><button id="reopen" hidden>重新开桌</button><div id="turnActions" class="turn-actions"><button id="discard" disabled>弃牌</button><button id="activate" hidden>发动技能</button><button id="play" class="primary" disabled>使用</button><button id="end" disabled>结束回合</button></div></div></section></div>
<aside class="sidebar"><details class="log-details" open><summary>战局记录</summary><div id="logs" class="logs"></div></details><div class="note">点击武将或卡牌可查看技能与使用说明。</div></aside></div></div></main>
<dialog id="roomDialog" class="room-dialog"><form id="roomForm"><button type="button" class="close" id="closeRoom" aria-label="关闭">×</button><h2 id="roomTitle">选择武将</h2><div id="heroStep"><p class="step-note">先选武将，技能说明就在卡片上。</p><div class="hero-tools"><fieldset id="heroFaction" class="choices" aria-label="势力筛选"></fieldset><input id="heroSearch" placeholder="搜索武将或技能" aria-label="搜索武将"></div><div id="heroGrid" class="hero-grid"></div><div class="picker-footer"><strong id="heroSelection">尚未选择武将</strong><button id="heroNext" type="button" class="primary" disabled>下一步</button></div></div><div id="roomStep" hidden><button type="button" id="heroBack" class="text-back">← 重新选将</button><div id="chosenHero" class="chosen-hero"></div><label>昵称<input id="nameInput" maxlength="14" autocomplete="nickname" placeholder="输入昵称"></label><label id="codeLabel"><span id="codeTitle">口令码</span><input id="codeInput" type="text" minlength="2" maxlength="24" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="输入口令码"><small id="codeHint">2～24 个汉字、字母、数字、_ 或 -</small></label><button type="submit" class="primary" id="roomSubmit">创建房间</button></div><p id="formError" role="alert"></p></form></dialog>
<dialog id="leaveDialog"><h2>退出房间？</h2><p id="leaveDescription"></p><div class="dialog-actions"><button id="cancelLeave">留在房间</button><button id="confirmLeave" class="danger">退出房间</button></div></dialog>
<dialog id="infoDialog"><button class="close" id="closeInfo" aria-label="关闭">×</button><h2 id="infoTitle">说明</h2><div id="infoContent"></div></dialog>
<dialog id="bookDialog"><button class="close" id="closeBook" aria-label="关闭">×</button><h2>图鉴 / 规则</h2><div class="book-filters"><fieldset id="bookType" class="choices" aria-label="图鉴类别"></fieldset><input id="bookSearch" placeholder="搜索卡牌、武将或技能" aria-label="搜索图鉴"></div><div id="bookContent"></div></dialog>
<div id="toast" class="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
