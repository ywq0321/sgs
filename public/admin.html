<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>三国杀 · 房间管理</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body class="admin-body"><header class="header"><h1>房间管理</h1><nav><a href="/" class="button-link">返回游戏</a><button id="refreshAdmin" hidden>刷新</button><button id="logoutAdmin" hidden>退出管理</button></nav></header><main class="admin-main">
<section id="loginPanel" class="admin-login"><h2>管理员登录</h2><p>输入服务器的管理密码。房间口令码不能用于管理员登录。</p><form id="adminLogin"><label for="adminPassword">管理密码</label><input id="adminPassword" type="password" minlength="12" maxlength="256" required autocomplete="current-password"><button type="submit" class="primary" id="loginAdmin">登录</button></form><p id="loginError" class="admin-error" role="alert"></p></section>
<section id="adminPanel" hidden><p class="admin-notice">管理操作会立即影响对局，并写入战局记录。</p><div class="admin-layout"><aside class="admin-rooms"><h2>房间 <span id="roomTotal">0</span></h2><div id="adminRooms"></div></aside><div id="roomPanel"><div id="emptyAdmin" class="admin-empty">暂无房间。玩家创建房间后，点击刷新即可查看。</div><div id="roomAdmin" hidden><div class="admin-room-heading"><div><h2 id="adminRoomTitle"></h2><p id="adminRoomStatus"></p></div><button id="closeAdminRoom" class="danger">关闭房间</button></div><h3>选择玩家</h3><div id="adminPlayers" class="admin-players"></div><div id="playerTools" class="admin-tools" hidden><section><h3>修改体力</h3><form id="hpForm"><label for="hpValue">设为</label><input id="hpValue" type="number" min="1" step="1" required><button id="setHp" class="primary" type="submit">修改体力</button></form></section><section><h3>发牌</h3><p id="selectedCardName">已选：杀</p><input id="adminCardSearch" type="search" placeholder="搜索卡牌" aria-label="搜索发牌卡牌"><div id="adminCards" class="admin-cards"></div><form id="giveForm"><label for="giveCount">数量</label><input id="giveCount" type="number" min="1" max="50" value="1" step="1" required><button id="giveCards" type="submit" class="primary">发牌</button></form></section><button id="kickPlayer" class="danger">踢出所选玩家</button></div><section class="admin-round"><h3>对局管理</h3><div><button id="skipAdmin">跳到下一回合</button><button id="finishAdmin">结束对局</button><button id="resetAdmin" class="danger">重置房间</button></div><p>重置会清除本局进度并保留座位；关闭房间则会让所有玩家退出。</p></section><details class="admin-log" open><summary>最近记录</summary><div id="adminLog"></div></details></div></div></div></section><p id="adminFeedback" role="status"></p></main><dialog id="adminConfirm"><h2 id="adminConfirmTitle">确认操作</h2><p id="adminConfirmText"></p><div class="dialog-actions"><button id="cancelAdminAction">取消</button><button id="confirmAdminAction" class="danger">确认</button></div></dialog><script type="module" src="/admin.js"></script></body></html>
